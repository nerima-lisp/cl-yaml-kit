name: Set up Nix
description: Install Nix and optional Cachix
inputs:
  cachix-cache:
    required: false
    default: ""
  cachix-auth-token:
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25
    - if: ${{ inputs.cachix-cache != '' }}
      uses: cachix/cachix-action@5f2d7c5294214f71b873db4b969586b980625e71
      with:
        name: ${{ inputs.cachix-cache }}
        authToken: ${{ inputs.cachix-auth-token }}
